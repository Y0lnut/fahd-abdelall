<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fahd Abd El All</title>
  <meta name="description" content="Fahd Abd El All, diplômé de NEOMA Business School. Gestion de projet, conseil, grands comptes et business development.">
  <meta name="theme-color" content="#101c2e">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Fahd Abd El All — Business et digital">
  <meta property="og:description" content="Gestion de projet, conseil, grands comptes et business development.">
  <meta property="og:image" content="assets/img/photo-square.jpg">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/BricolageGrotesque.woff2" as="font" type="font/woff2" crossorigin>
  <script>try{var l=new URLSearchParams(location.search).get("lang")||localStorage.getItem("lang");if(l==="ar"){document.documentElement.lang="ar";document.documentElement.dir="rtl"}}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="home">
  <a class="skip" href="#main">Aller au contenu</a>
  <div id="shell-top"></div>
  <main id="main">
    <section class="hero">
      <div class="hero-copy">
        <p class="prompt" id="prompt"></p>
        <h1 class="name"><span class="name-first" id="name-first">Fahd</span><span class="name-last" id="name-last">Abd El All</span></h1>
        <p class="tagline" id="tagline"></p>
        <p class="rotator" aria-live="polite"><span class="rot-sym" aria-hidden="true">›</span><span id="rot"></span><span class="cursor" aria-hidden="true"></span></p>
        <p class="pitch" id="pitch"></p>
        <p class="status"><span class="pulse" aria-hidden="true"></span><span id="status"></span></p>
        <div class="actions">
          <a class="btn btn-brass magnetic" id="hero-mail" href="contact.html"></a>
          <a class="btn btn-line magnetic" data-cv href="#" download></a>
        </div>
      </div>
      <figure class="portrait" id="portrait">
        <div class="portrait-in" id="portrait-in">
          <img src="assets/img/photo.jpg" alt="Portrait de Fahd Abd El All" width="800" height="1066" fetchpriority="high">
          <span class="scan" aria-hidden="true"></span>
        </div>
        <figcaption class="badge"><span class="pulse" aria-hidden="true"></span><span id="badge"></span></figcaption>
      </figure>
    </section>

    <section class="block">
      <header class="block-head"><h2 id="home-title"></h2><p id="home-intro"></p></header>
      <div class="pillars" id="pillars"></div>
    </section>

    <section class="block now rv">
      <div class="now-text"><h2 class="h-sm" id="now-title"></h2><p id="now"></p></div>
      <div class="now-cta"><p class="now-cta-t" id="cta-title"></p><p id="cta"></p><a class="btn btn-ink magnetic" id="now-mail" href="contact.html"></a></div>
    </section>
  </main>
  <div id="shell-bottom"></div>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
